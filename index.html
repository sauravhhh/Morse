<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Morse — Text to Morse Code Translator</title>
<meta name="description" content="Translate text to Morse code and back. Play it as audio, copy with one tap. Works offline.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --navy:#0f172a; --navy2:#1e293b; --gold:#c9a227;
  --ink:#1c1c1c; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--navy);color:#fff;padding:18px 20px;}
.hwrap{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.hwrap img{width:38px;height:38px;border-radius:9px;}
.hwrap h1{font-size:19px;font-weight:700;letter-spacing:.2px;}
.hwrap p{font-size:12px;color:#94a3b8;letter-spacing:.4px;}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:24px 20px 40px;}
.dir{display:flex;background:#e8edf3;border-radius:12px;padding:4px;margin-bottom:20px;}
.dir button{flex:1;border:none;background:transparent;padding:11px;border-radius:9px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}
.dir button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(15,23,42,.12);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);}
.card label{display:block;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
textarea{width:100%;border:none;outline:none;resize:vertical;font:inherit;font-size:16px;color:var(--ink);background:transparent;min-height:96px;line-height:1.7;}
textarea::placeholder{color:#b6bfcc;}
.output{font-size:19px;letter-spacing:2px;line-height:2;word-break:break-all;min-height:96px;color:var(--navy);font-weight:600;}
.output.empty{color:#b6bfcc;font-weight:400;letter-spacing:.3px;font-size:15px;}
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn{flex:1;min-width:120px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;font:inherit;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy2);}
.btn:disabled{opacity:.45;cursor:default;}
.btn svg{flex-shrink:0;}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:20px;}
footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:10px;opacity:0;pointer-events:none;transition:all .25s;z-index:50;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <img src="icons/icon-192.png" alt="Morse app icon">
    <div><h1>Morse</h1><p>TEXT ⇄ MORSE TRANSLATOR</p></div>
  </div>
</header>

<main>
  <div class="dir" role="tablist">
    <button id="btnT2M" class="on" onclick="setDir('t2m')">Text → Morse</button>
    <button id="btnM2T" onclick="setDir('m2t')">Morse → Text</button>
  </div>

  <div class="card">
    <label id="inLabel" for="input">Your text</label>
    <textarea id="input" placeholder="Type something…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  </div>

  <div class="card">
    <label>Morse code</label>
    <div class="output empty" id="output">Translation appears here</div>
  </div>

  <div class="actions">
    <button class="btn primary" id="playBtn" onclick="playMorse()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Play
    </button>
    <button class="btn" id="copyBtn" onclick="copyOut()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy
    </button>
        <button class="btn" onclick="shareIt()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Share
    </button>
<button class="btn" onclick="clearAll()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Clear
    </button>
  </div>


  <p class="hint">Tip: separate Morse letters with a space, words with /</p>
</main>

<footer>Made for learners · Works offline</footer>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
let dir = "t2m";
const input = document.getElementById("input");
const output = document.getElementById("output");
const inLabel = document.getElementById("inLabel");
const playBtn = document.getElementById("playBtn");
const copyBtn = document.getElementById("copyBtn");

function setDir(d){
  dir = d;
  document.getElementById("btnT2M").classList.toggle("on", d==="t2m");
  document.getElementById("btnM2T").classList.toggle("on", d==="m2t");
  inLabel.textContent = d==="t2m" ? "Your text" : "Morse code";
  input.placeholder = d==="t2m" ? "Type something…" : "… --- …";
  input.value = ""; translate();
  input.focus();
}
function translate(){
  const v = input.value;
  let r = dir==="t2m" ? textToMorse(v) : morseToText(v);
  if(!r){ output.textContent = "Translation appears here"; output.classList.add("empty"); }
  else{ output.textContent = r; output.classList.remove("empty"); }
  const has = !!r;
  playBtn.disabled = !has; copyBtn.disabled = !has;
}
function clearAll(){ input.value=""; translate(); input.focus(); }
function toast(t){
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"), 1600);
}
function shareIt(){
  const has = !output.classList.contains("empty");
  const data = has
    ? { title: "Morse", text: output.textContent }
    : { title: "Morse", text: "Try Morse", url: location.href };
  if(navigator.share){ navigator.share(data).catch(()=>{}); return; }
  const t = has ? output.textContent : location.href;
  const done = ()=>toast("Copied \u2014 paste it anywhere to share");
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(done); }
  else{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
}
function copyOut(){
  const t = output.textContent;
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast("Copied")); }
  else{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Copied"); }
}
/* audio playback */
let actx = null, playing = false;
function beep(t, dur){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "sine"; o.frequency.value = 650;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.05);
}
function playMorse(){
  if(playing) return;
  const code = dir==="t2m" ? textToMorse(input.value) : input.value;
  if(!code.trim()) return;
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  actx.resume();
  playing = true; playBtn.disabled = true;
  const unit = 0.09;
  let t = actx.currentTime + 0.1;
  for(const ch of code){
    if(ch==="."){ beep(t, unit); t += unit*2; }
    else if(ch==="-"){ beep(t, unit*3); t += unit*4; }
    else if(ch===" "){ t += unit*2; }
    else if(ch==="/"){ t += unit*4; }
  }
  setTimeout(()=>{ playing=false; playBtn.disabled=false; }, (t-actx.currentTime)*1000+200);
}
input.addEventListener("input", translate);
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
